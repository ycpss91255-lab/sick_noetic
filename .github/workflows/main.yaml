name: Main CI/CD Pipeline
run-name: ${{ github.actor }} triggered CI/CD on ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:

  call-docker-build:
    permissions:
      contents: read
    uses: ycpss91255-lab/base/.github/workflows/build-worker.yaml@v0.43.0-rc9
    with:
      image_name: sick_noetic
      # merge_group payload 沒有 head repo 資訊；merge queue 只有 maintainer 能排入，
      # 視為同 repo 可信來源，build job 才不會被 fork guard 略過（base#1587）。
      merge_group_same_repo: 'true'
      build_args: |
        ROS_DISTRO=noetic
        ROS_TAG=ros-base
        UBUNTU_CODENAME=focal

  ci-rollup:
    name: ci-rollup
    needs: call-docker-build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 檢查必要 job 結果
        env:
          BUILD_RESULT: ${{ needs.call-docker-build.result }}
        run: |
          if [ "${BUILD_RESULT}" != "success" ]; then
            echo "call-docker-build 結果為 ${BUILD_RESULT}"
            exit 1
          fi

  call-release:
    needs: call-docker-build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: ycpss91255-lab/base/.github/workflows/release-worker.yaml@v0.43.0-rc9
    with:
      archive_name_prefix: sick_noetic
    secrets: inherit
